name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - platform-2.0
      - production
      - "preview/**"
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a running production transfer or cutover.
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

permissions:
  contents: read

jobs:
  evidence:
    name: Exact commit release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
      runId: ${{ steps.proof.outputs.runId }}
      artifactId: ${{ steps.proof.outputs.artifactId }}
      artifactDigest: ${{ steps.proof.outputs.artifactDigest }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify existing full CI for this production commit
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/production ]; then
            node deploy/automation/ci-evidence.mjs "$RELEASE_SHA"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: ${{ matrix.name }}
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: ${{ needs.evidence.outputs.reuse != 'true' && matrix.name == 'Tests' && 'mongo:7' || '' }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository harness
            command: pnpm harness
          - name: Typecheck and API syntax
            command: pnpm typecheck && pnpm check:api
          - name: Tests
            command: pnpm test
          - name: Lint
            command: pnpm lint
          - name: Security checks
            command: pnpm security
          - name: Production build
            command: pnpm build

    steps:
      - name: Reuse already verified CI evidence
        if: needs.evidence.outputs.reuse == 'true'
        env:
          SOURCE_RUN: ${{ needs.evidence.outputs.runId }}
        run: echo "This exact commit passed this check in trusted full CI run $SOURCE_RUN."
      - name: Check out repository
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        if: needs.evidence.outputs.reuse != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up production-compatible Python
        if: needs.evidence.outputs.reuse != 'true' && matrix.name == 'Tests'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: needs.evidence.outputs.reuse != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        if: needs.evidence.outputs.reuse != 'true'
        run: ${{ matrix.command }}
        env:
          CI: true
          FWX_TEST_MONGO_URI: ${{ matrix.name == 'Tests' && 'mongodb://127.0.0.1:27017' || '' }}

  browser:
    name: Browser core flow
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: ${{ needs.evidence.outputs.reuse != 'true' && 'mongo:7' || '' }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Reuse already verified CI evidence
        if: needs.evidence.outputs.reuse == 'true'
        env:
          SOURCE_RUN: ${{ needs.evidence.outputs.runId }}
        run: echo "This exact commit passed all browser checks in trusted full CI run $SOURCE_RUN."
      - name: Check out repository
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pnpm
        if: needs.evidence.outputs.reuse != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.12.0
          run_install: false
      - name: Set up Node.js
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and browser
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
      - name: Build production bundle and API dependencies
        if: needs.evidence.outputs.reuse != 'true'
        run: pnpm build && pnpm --filter api build:runtime-deps
        env:
          VITE_ASSET_BASE: ''
          VITE_API_URL: /api
      - name: Start isolated application and verify core flow
        if: needs.evidence.outputs.reuse != 'true'
        env:
          CI: true
          MONGODB_URI: mongodb://127.0.0.1:27017/fwx_e2e
          PORT: 3000
          CORS_ORIGIN: http://127.0.0.1:4173
          PUBLIC_BASE_URL: http://127.0.0.1:4173
          STORAGE_DRIVER: disk
          FWX_E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          export JWT_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("hex"))')"
          export UPLOAD_DIR="$RUNNER_TEMP/fwx-e2e-uploads"
          pnpm --filter api start > "$RUNNER_TEMP/fwx-api.log" 2>&1 &
          pnpm --filter web preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/fwx-web.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/api/health
          pnpm --filter web test:e2e

      - name: Package the exact browser-tested public bundle
        if: needs.evidence.outputs.reuse != 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/fwx-web-release"
          node deploy/automation/package-web.mjs apps/web/dist "$RELEASE_SHA" "$RUNNER_TEMP/fwx-web-release/web.tar.gz" > "$RUNNER_TEMP/fwx-web-release/web.sha256"

      - name: Retain the tested frontend release
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-release-${{ github.sha }}
          path: ${{ runner.temp }}/fwx-web-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  docker-smoke:
    name: API container smoke
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: ${{ needs.evidence.outputs.reuse != 'true' && 'mongo:7' || '' }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Reuse already verified CI evidence
        if: needs.evidence.outputs.reuse == 'true'
        env:
          SOURCE_RUN: ${{ needs.evidence.outputs.runId }}
        run: echo "This exact commit passed the production API image check in trusted full CI run $SOURCE_RUN."
      - name: Check out repository
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build API production image
        if: needs.evidence.outputs.reuse != 'true'
        run: docker build --file apps/api/Dockerfile --tag fwx-api:ci .
      - name: Verify container against isolated MongoDB
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export JWT_SECRET="$(openssl rand -hex 48)"
          docker run --detach --name fwx-api-smoke --network host \
            --env NODE_ENV=production --env JWT_SECRET \
            --env MONGODB_URI=mongodb://127.0.0.1:27017/fwx_container_smoke \
            --env PORT=3000 --env STORAGE_DRIVER=disk fwx-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          docker exec fwx-api-smoke node -e '
            fetch("http://127.0.0.1:3000/api/health").then(async response => {
              const health = await response.json();
              if (!response.ok || health.status !== "OK" || health.db !== "connected") process.exit(1);
              console.log("API container health: OK; MongoDB connected");
            }).catch(() => process.exit(1));
          '
      - name: Container logs and cleanup
        if: always() && needs.evidence.outputs.reuse != 'true'
        run: |
          docker logs fwx-api-smoke || true
          docker rm --force fwx-api-smoke || true

  deploy-production:
    name: Publish tested frontend
    needs: [evidence, verify, browser, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ecs-production
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ecs-production
      cancel-in-progress: false
    steps:
      - name: Check out this trusted production commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js without installing project dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download and hard-verify the exact tested artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          REUSE: ${{ needs.evidence.outputs.reuse }}
          SOURCE_RUN: ${{ needs.evidence.outputs.runId }}
          ARTIFACT_ID: ${{ needs.evidence.outputs.artifactId }}
          ARTIFACT_DIGEST: ${{ needs.evidence.outputs.artifactDigest }}
        run: |
          if [ "$REUSE" = true ]; then
            node deploy/automation/ci-evidence.mjs "$RELEASE_SHA" --download "$RUNNER_TEMP/fwx-web-release" --run "$SOURCE_RUN" --artifact "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST"
          else
            node deploy/automation/ci-evidence.mjs "$RELEASE_SHA" --download "$RUNNER_TEMP/fwx-web-release" --run "$GITHUB_RUN_ID"
          fi
      - name: Publish frontend and verify the public website
        env:
          RELEASE_SHA: ${{ github.sha }}
          FWX_DEPLOY_HOST: ${{ vars.FWX_DEPLOY_HOST }}
          FWX_DEPLOY_PORT: ${{ vars.FWX_DEPLOY_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          node deploy/automation/send-web.mjs publish "$RELEASE_SHA" "$RUNNER_TEMP/fwx-web-release/web.tar.gz" "$(cat "$RUNNER_TEMP/fwx-web-release/web.sha256")"
